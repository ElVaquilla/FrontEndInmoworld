<div class="login-container">
  <h2 *ngIf="!isRegisterMode">Iniciar Sesión</h2>
  <h2 *ngIf="isRegisterMode">Registrarse</h2>
  
  <form (ngSubmit)="onSubmit()" #form="ngForm">
    <div>
      <label for="username">Usuario:</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        required
      />
    </div>
    
    <div *ngIf="isRegisterMode">
      <label for="email">Correo Electrónico:</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <div *ngIf="isRegisterMode">
      <label for="confirmPassword">Confirmar Contraseña:</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        required
      />
    </div>

    <button type="submit">
      {{ isRegisterMode ? 'Registrarse' : 'Iniciar Sesión' }}
    </button>

    <button type="button" class="toggle-button" (click)="toggleMode()">
      {{ isRegisterMode ? '¿Ya tienes cuenta? Inicia sesión' : 'Registrarse' }}
    </button>
  </form>
</div>
